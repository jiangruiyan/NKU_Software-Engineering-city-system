<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>智能城市生成系统 · 登录</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f0f2f5; --surface: #ffffff; --border: #e4e7ed;
      --accent: #5b6cf0; --text: #1e293b; --text-dim: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', 'Noto Sans SC', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    /* 背景网格 */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(91,108,240,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(91,108,240,0.06) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }
    /* 发光圆 */
    .glow {
      position: fixed;
      width: 600px; height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(91,108,240,0.06) 0%, transparent 70%);
      top: -200px; left: -200px;
      pointer-events: none;
    }
    .glow2 {
      position: fixed;
      width: 400px; height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(16,185,129,0.05) 0%, transparent 70%);
      bottom: -100px; right: -100px;
      pointer-events: none;
    }
    .login-wrap {
      position: relative;
      z-index: 10;
      width: 380px;
    }
    .login-brand {
      text-align: center;
      margin-bottom: 32px;
    }
    .brand-icon {
      width: 52px; height: 52px;
      background: linear-gradient(135deg, #5b6cf0, #10b981);
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 14px;
      box-shadow: 0 8px 32px rgba(91,108,240,0.18);
    }
    .brand-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .brand-sub {
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 6px;
      letter-spacing: 0.3px;
    }
    .login-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.1);
    }
    .login-box h2 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 28px;
      letter-spacing: 0.3px;
    }
    .form-row { margin-bottom: 18px; }
    .form-row label {
      display: block;
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 6px;
      font-weight: 500;
      letter-spacing: 0.3px;
    }
    .form-row input {
      width: 100%;
      background: #f1f5f9;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 11px 15px;
      border-radius: 9px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
    }
    .form-row input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(91,108,240,0.1);
      background: white;
    }
    .form-row input::placeholder { color: #c0c8d4; }
    .btn-login {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      margin-top: 10px;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(91,108,240,0.25);
    }
    .btn-login:hover {
      opacity: 0.92;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(91,108,240,0.35);
    }
    .btn-login:active { transform: translateY(0); }
    .error-msg {
      color: #ef4444;
      font-size: 12px;
      margin-top: 12px;
      text-align: center;
      min-height: 18px;
      font-weight: 500;
    }
    .hint {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-dim);
      line-height: 1.8;
    }
    .hint strong { color: #64748b; }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="glow2"></div>
  <div class="login-wrap">
    <div class="login-brand">
      <div class="brand-title">智能城市生成系统</div>
      <div class="brand-sub">Intelligent City Generation System</div>
    </div>
    <div class="login-box">
      <h2>账号登录</h2>
      <div class="form-row">
        <label>用户名</label>
        <input type="text" id="username" placeholder="请输入用户名" autocomplete="username" />
      </div>
      <div class="form-row">
        <label>密码</label>
        <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password"
               onkeydown="if(event.key==='Enter') doLogin()" />
      </div>
      <button class="btn-login" onclick="doLogin()">登 录</button>
      <div class="error-msg" id="error"></div>
      <div class="hint">
        测试账号：<strong>admin01</strong> / <strong>analyst01</strong> / <strong>modeler01</strong><br>
        密码均为 <strong>password123</strong>
      </div>
    </div>
  </div>
  <script>
    const API = window.location.origin + '/api';
    if (localStorage.getItem('token')) {
      const role = localStorage.getItem('role');
      window.location.href = role + '.html';
    }
    async function doLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errEl = document.getElementById('error');
      if (!username || !password) { errEl.textContent = '请填写用户名和密码'; return; }
      try {
        const res = await fetch(API + '/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        if (res.ok) {
          const data = await res.json();
          localStorage.setItem('token', data.token);
          localStorage.setItem('role', data.role);
          localStorage.setItem('username', data.username);
          const pages = { admin: 'admin.html', analyst: 'analyst.html', modeler: 'modeler.html' };
          window.location.href = pages[data.role];
        } else {
          const err = await res.json();
          errEl.textContent = err.detail || '登录失败';
        }
      } catch (e) {
        errEl.textContent = '无法连接到服务器，请确认后端已启动';
      }
    }
  </script>
</body>
</html>
